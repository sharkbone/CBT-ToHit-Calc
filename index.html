    <title>Classic Battletech To-Hit Calculator</title>
    <meta charset="UTF-8"/>

    <style>
      em {color: red;}
      input:invalid {
        border: solid red 3px;
      }
      .cell {
        display: inline-block;
        margin: 0px;
        padding-left: 10px;
        padding-right: 10px;
        text-align: left;
        vertical-align: top;
      }
      #content {
        max-width: 900px;
        text-align: center;
        margin: auto;
        padding: 0px;
      }
      header {
        background-image: url("MadCatBackground.jpg");
        background-size: 100%;
        height: 200px;
        padding: 50px;
        border: 1px;
        border-radius: 15px;
      }
      h1 {
        color: white;
        text-shadow: 10px 10px 10px black;
      }
      .row {
        display: inline-block;
      }
      input[type=number] {
        width: 25px;
      }
      h2 {
        margin: 0px;
        padding: 0px;
        margin-bottom: 5px;
        background-color: orange;
        width: 100%;
      }
      td, th {
        border-bottom: solid 1px black;
        border-right: solid 1px black;
        min-width: 25px;
        text-align: center;
      }
      p {
        margin: 0px;
        padding: 0px;
        margin-bottom: 5px;
      }
      fieldset {
        border: none;
      }
      .green {
        font-weight: bold;
        color: white;
        background-color: green;
      }
      .yellow {
        font-weight: bold;
        color: black;
        background-color: orange;
      }
      .red {
        font-weight: bold;
        color: white;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div id="content">
    <header>
      <h1>Classic Battletech To-Hit Calculator</h1>
    </header>
    <!-- More condensed layout to follow, not explicitly following GATOR -->
      <h2>Attacker</h2>
        <div>
          <div class="cell">
          <label for="gunnery">Gunnery: </label><input type="number" id="gunnery" value="0" /><br/>
          <label for="minRange">Weapon Minimum Range: </label><input type="number" id="minRange" value="0" min="0"/><br/>
          <label for="targetRange">Range to Target: </label><input type="number" id="targetRange" value="0" min="0" disabled/><br/>
          <label for="tarComp">Targeting Computer?</label><input type="checkbox" id="tarComp"/><br/>
          <label for="pulse">Pulse Weapon?</label><input type="checkbox" id="pulse"/>
          </div>
          <fieldset class="cell" id="attackerMove">
            <legend>Movement Type</legend>
            <input type="radio" id="still" name="move" value="0" checked/><label for="still">Stand Still</label><br/>
            <input type="radio" id="walk" name="move" value="1" /><label for="walk">Walk</label><br/>
            <input type="radio" id="run" name="move" value="2" /><label for="run">Run</label><br/>
            <input type="radio" id="jump" name="move" value="3" /><label for="jump">Jump</label>
            </fieldset>
          <div class="cell">
            <label for="lower-arm">Lower Arm Actuator Damage?</label><input type="checkbox" id="lower-arm"/><br/>
            <label for="upper-arm">Upper Arm Actuator Damage?</label><input type="checkbox" id="upper-arm" /><br/>
            <label for="shoulder">Shoulder Actuator Damage?</label><input type="checkbox" id="shoulder" /><br/>
            <label for="heat">Heat Level: </label><input type="number" id="heat" value="0" min="0" max="30" />
            
          </div>
        </div>
        <h2>Target</h2>
        <div>
          <div class="cell">
            <label for="Tmove">Target Movement Mod: </label><input type="number" id="Tmove" value="0" min="0"/><br/>
            <label for="Tjump">Jump?</label><input type="checkbox" id="Tjump" /><br/>
            <label for="immobile">Target Immobile?</label><input type="checkbox" id="immobile" />
            
          </div>
          <div class="cell">
            <label for="lightTarget">Target in Light Trees?</label><input type="checkbox" id="lightTarget" /><br/>
            <label for="heavyTarget">Target in Heavy Trees?</label><input type="checkbox" id="heavyTarget" /><br/>
            <label for="cover"> Partial Cover/Depth 1 Water?</label><input type="checkbox" id="cover" />
          </div>
        </div>
        <h2>Intervening Terrain</h2>
        <div>
          <fieldset class="cell" id="lightTrees">
            <legend>Intervening Light Trees</legend>
            <input type="radio" name="lightTrees" value="0" id="l0" checked><label for="l0">Zero</label><br/>
            <input type="radio" name="lightTrees" value="1" id="l1"><label for="l1">One</label><br/>
            <input type="radio" name="lightTrees" value="2" id="l2"><label for="l2">Two</label><br/>
            <input type="radio" name="lightTrees" value="3" id="l3"><label for="l3">Three +</label>
          </fieldset>
          <fieldset class="cell" id="heavyTrees">
            <legend>Intervening Heavy Trees</legend>
            <input type="radio" name="heavyTrees" value="0" id="h0" checked><label for="h0">Zero</label><br/>
            <input type="radio" name="heavyTrees" value="2" id="h1"><label for="h1">One</label><br/>
            <input type="radio" name="heavyTrees" value="4" id="h2"><label for="h1">Two +</label>
          </fieldset>
        </div>
        <h2>Results</h2>
        <div>
          <p id="message">Messages: </p>
          <div class="cell">
            
          <table>
            <tr><th></th><th>S</th><th>M</th><th>L</th></tr>
            <tr><td>Primary</td><td id="primaryShort" class="result"></td><td id="primaryMedium" class="result"></td><td id="primaryLong" class="result"></td></tr>
            <tr><td>Secondary</td><td id="secondaryShort" class="result"></td><td id="secondaryMedium" class="result"></td><td id="secondaryLong" class="result"></td></tr>
            <tr><td>Secondary<br/>Rear/Side</td><td id="secRearShort" class="result"></td><td id="secRearMedium" class="result"></td><td id="secRearLong" class="result"></td></tr>
          </table>
          </div>
        </div>

  <script>
    // we'll have to get references to all the DOM objects we need to read

    // references to the Attacker block
    let gunnery = document.getElementById("gunnery");
    let minRange = document.getElementById("minRange");
    let targetRange = document.getElementById("targetRange");
    let targetingComputer = document.getElementById("tarComp");
    let pulseWeapon = document.getElementById("pulse");
    let aMove = document.getElementsByName("move");
    let shoulder = document.getElementById("shoulder");
    let upperArm = document.getElementById("upper-arm");
    let lowerArm = document.getElementById("lower-arm");
    let heat = document.getElementById("heat");

    // references for the Target block
    let tMove = document.getElementById("Tmove");
    let jump = document.getElementById("Tjump");
    let immobile = document.getElementById("immobile");
    let lightTarget = document.getElementById("lightTarget");
    let heavyTarget = document.getElementById("heavyTarget");
    let cover = document.getElementById("cover");

    // references for the Intervening Terrain block
    let lightTrees = document.getElementsByName("lightTrees");
    let heavyTrees = document.getElementsByName("heavyTrees");

    // references for the Results block
    let message = document.getElementById("message");
    let primaryShort = document.getElementById("primaryShort");
    let primaryMedium = document.getElementById("primaryMedium");
    let primaryLong = document.getElementById("primaryLong");
    let secondShort = document.getElementById("secondShort");
    let secondMedium = document.getElementById("secondMedium");
    let secondLong = document.getElementById("secondLong");
    let secRearShort = document.getElementById("secRearShort");
    let secRearMedium = document.getElementById("secRearMedium");
    let secRearLong = document.getElementById("secRearLong");
    
    
    

    // I need a function to calculate the modified to hit number
    function calculateToHit() {
      let baseResult = 0;
      let baseMessage = "Messages: ";

      // add in the Attacker's numbers
      // gunnery
      baseResult += Number(gunnery.value);
      // minimum range
      let minRangeMod = 0;
      if (Number(minRange.value) > 0 && Number(minRange.value) > Number(targetRange.value)) {
        minRangeMod = Number(minRange.value) - Number(targetRange.value) + 1;
        baseResult += minRangeMod;
      }
      // targeting computer and pulse weapons
      if (targetingComputer.checked) baseResult -= 1;
      if (pulseWeapon.checked) baseResult -= 2;
      // attacker movement
      for(i=0; i < aMove.length; i++) {
        if (aMove[i].checked) baseResult += Number(aMove[i].value);
      }
      // arm damage
      let armDamage = 0;
      if (upperArm.checked) armDamage += 1;
      if (lowerArm.checked) armDamage += 1;
      if (shoulder.checked) armDamage = 4;
      baseResult += armDamage;
      // heat
      let heatMod = 0;
      if (Number(heat.value) >= 8) heatMod = 1;
      if (Number(heat.value) >= 13) heatMod = 2;
      if (Number(heat.value) >= 17) heatMod = 3
      if (Number(heat.value) >= 23) heatMod = 4;
      baseResult += heatMod;
      console.log(baseResult);

      // add in the target's numbers
      // target movement
      baseResult += Number(tMove.value);
      if (jump.checked) baseResult += 1;
      if (immobile.checked) baseResult -= 4;
      if (lightTarget.checked) baseResult += 1;
      if (heavyTarget.checked) baseResult += 2;
      if (cover.checked) baseResult += 1;
      console.log(baseResult);

      // Intervening terrain numbers
      let treesMod = 0;
      for(i=0; i < lightTrees.length; i++) {
        if (lightTrees[i].checked) treesMod += Number(lightTrees[i].value);
      }
      for(i=0; i < heavyTrees.length; i++) {
        if (heavyTrees[i].checked) treesMod += Number(heavyTrees[i].value);
      }
      if (treesMod > 2) baseMessage += "Line of sight blocked by trees. "
      baseResult += treesMod;
      if (baseResult > 12) baseMessage += "Attack impossible across all ranges."
      console.log(baseResult);

      // figure the final results and put them on the page
      renderCell(primaryShort, baseResult);
      renderCell(primaryMedium, baseResult + 2);
      renderCell(primaryLong, baseResult + 4);
      renderCell(secondaryShort, baseResult + 1);
      renderCell(secondaryMedium, baseResult + 3);
      renderCell(secondaryLong, baseResult + 5);
      renderCell(secRearShort, baseResult + 2);
      renderCell(secRearMedium, baseResult + 4);
      renderCell(secRearLong, baseResult + 6);

      // post any messages generaged
      message.innerText = baseMessage;
    }

    function enableTargetRange () {
      if (Number(minRange.value) === 0) {
        targetRange.value = 0;
        targetRange.disabled = true;
      } else {
        targetRange.disabled = false;
      }
      calculateToHit();
    }

    function renderCell (cell, result) {
      if (result < 8) cell.className = "green";
      if (result > 7 && result < 13) cell.className = "yellow";
      if (result > 12) cell.className = "red";
      cell.innerText = result;
    }

    // now I need to make the even handlers for all the dom elements
    // listeners for the Attacker block
    gunnery.addEventListener("change", calculateToHit);
    minRange.addEventListener("change", enableTargetRange);
    targetRange.addEventListener("change", calculateToHit);
    targetingComputer.addEventListener("change", calculateToHit);
    pulseWeapon.addEventListener("change", calculateToHit);
    for (i=0; i< aMove.length; i++) aMove[i].addEventListener("change", calculateToHit);
    shoulder.addEventListener("change", calculateToHit);
    upperArm.addEventListener("change", calculateToHit);
    lowerArm.addEventListener("change", calculateToHit);
    heat.addEventListener("change", calculateToHit);

    // listeners for the Target block
    tMove.addEventListener("change", calculateToHit);
    jump.addEventListener("change", calculateToHit);
    immobile.addEventListener("change", calculateToHit);
    lightTarget.addEventListener("change", calculateToHit);
    heavyTarget.addEventListener("change", calculateToHit);
    cover.addEventListener("change", calculateToHit);

    // intervening terrain listeners
    for (i=0; i< lightTrees.length; i++) lightTrees[i].addEventListener("change", calculateToHit);
    for (i=0; i< heavyTrees.length; i++) heavyTrees[i].addEventListener("change", calculateToHit);

    window.addEventListener("load", calculateToHit);

  </script>
